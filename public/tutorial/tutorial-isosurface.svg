<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">See electron density and orbitals</title>
  <desc id="desc">Loading a Gaussian Cube file shows 3D isosurfaces. The Isosurface panel is a list of surfaces you add and remove; each row has a color, an isovalue slider, an opacity slider, and a visibility checkbox.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1220" flood-opacity="0.16"/></filter>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08131f"/><stop offset="1" stop-color="#05070c"/></linearGradient>
    <radialGradient id="posLobe" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#7db0ff"/><stop offset="1" stop-color="#2f6fe0"/></radialGradient>
    <radialGradient id="negLobe" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#ff8f8f"/><stop offset="1" stop-color="#d63b3b"/></radialGradient>
    <radialGradient id="outLobe" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#63d68a"/><stop offset="1" stop-color="#1f9d54"/></radialGradient>
    <style>
      .page { fill: #f5f7fb; }
      .screen { fill: url(#screen); stroke: #d6dde8; stroke-width: 2; filter: url(#shadow); }
      .mock { fill: #151b24; stroke: #d6dde8; stroke-width: 2; filter: url(#shadow); }
      .heading { fill: #f8fafc; font: 800 17px system-ui, sans-serif; }
      .addBtn { fill: #263244; stroke: #7f92aa; stroke-width: 1.2; }
      .addText { fill: #eaf2ff; font: 700 12px system-ui, sans-serif; }
      .readout { fill: #aab7c8; font: 11px system-ui, sans-serif; }
      .muted { fill: #93a4b8; font: 13px system-ui, sans-serif; }
      .track { fill: #2a3444; }
      .fill { fill: #22b8ff; }
      .knob { fill: #22b8ff; stroke: #eaf7ff; stroke-width: 1.5; }
      .swatch { stroke: #eaf2ff; stroke-width: 1.2; }
      .box { fill: #0b1119; stroke: #7f92aa; stroke-width: 1.3; }
      .rm { fill: #263244; stroke: #7f92aa; stroke-width: 1.2; }
      .rmText { fill: #dce5f2; font: 700 12px system-ui, sans-serif; text-anchor: middle; }
      .badge { fill: #22b8ff; stroke: #ffffff; stroke-width: 3; }
      .badgeText { fill: white; font: 800 17px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
      .legendCard { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1.5; filter: url(#shadow); }
      .legendTitle { fill: #0f172a; font: 800 16px system-ui, sans-serif; }
      .legendText { fill: #536273; font: 13.5px system-ui, sans-serif; }
    </style>
  </defs>
  <rect class="page" width="1100" height="560"/>
  <text x="54" y="62" fill="#0f172a" style="font: 800 28px system-ui, sans-serif;">See electron density and orbitals</text>
  <text x="54" y="88" fill="#64748b" style="font: 16px system-ui, sans-serif;">Load a Gaussian Cube (.cube) file, then stack as many surfaces as you like.</text>

  <!-- scene with nested surfaces -->
  <g transform="translate(54 120)">
    <rect class="screen" width="470" height="320" rx="20"/>
    <g transform="translate(235 162)">
      <ellipse cx="6" cy="0" rx="132" ry="126" fill="url(#outLobe)" opacity="0.35"/>
      <ellipse cx="-64" cy="8" rx="70" ry="66" fill="url(#negLobe)" opacity="0.9"/>
      <ellipse cx="58" cy="-6" rx="82" ry="78" fill="url(#posLobe)" opacity="0.75"/>
      <circle cx="-2" cy="2" r="22" fill="#9aa4b2" stroke="#c9d2dd" stroke-width="2"/>
    </g>
    <text class="muted" x="22" y="300">A faint green shell, plus the blue and red orbital lobes.</text>
  </g>

  <!-- mock isosurface list panel -->
  <g transform="translate(566 120)">
    <rect class="mock" width="300" height="216" rx="14"/>
    <text class="heading" x="18" y="32">Isosurface</text>
    <rect class="addBtn" x="150" y="16" width="94" height="24" rx="5"/>
    <text class="addText" x="162" y="32">+ Add surface</text>
    <circle class="badge" cx="262" cy="28" r="16"/><text class="badgeText" x="262" y="29">1</text>

    <!-- row 1: blue positive -->
    <g transform="translate(18 58)">
      <rect class="swatch" x="0" y="2" width="20" height="20" rx="4" fill="#3b82f6"/>
      <rect class="track" x="32" y="8" width="120" height="7" rx="3.5"/>
      <rect class="fill" x="32" y="8" width="78" height="7" rx="3.5"/>
      <circle class="knob" cx="110" cy="11" r="8"/>
      <text class="readout" x="32" y="34">0.144</text>
      <rect class="track" x="168" y="8" width="52" height="7" rx="3.5"/>
      <rect class="fill" x="168" y="8" width="30" height="7" rx="3.5"/>
      <circle class="knob" cx="198" cy="11" r="7"/>
      <rect class="box" x="234" y="3" width="18" height="18" rx="3"/>
      <path d="M237 12 l4 4 l7 -8" fill="none" stroke="#22b8ff" stroke-width="2.4"/>
      <rect class="rm" x="262" y="3" width="20" height="18" rx="4"/>
      <text class="rmText" x="272" y="16">&#215;</text>
    </g>

    <!-- row 2: red negative -->
    <g transform="translate(18 106)">
      <rect class="swatch" x="0" y="2" width="20" height="20" rx="4" fill="#ef4444"/>
      <rect class="track" x="32" y="8" width="120" height="7" rx="3.5"/>
      <rect class="fill" x="32" y="8" width="42" height="7" rx="3.5"/>
      <circle class="knob" cx="74" cy="11" r="8"/>
      <text class="readout" x="32" y="34">-0.144</text>
      <rect class="track" x="168" y="8" width="52" height="7" rx="3.5"/>
      <rect class="fill" x="168" y="8" width="30" height="7" rx="3.5"/>
      <circle class="knob" cx="198" cy="11" r="7"/>
      <rect class="box" x="234" y="3" width="18" height="18" rx="3"/>
      <path d="M237 12 l4 4 l7 -8" fill="none" stroke="#22b8ff" stroke-width="2.4"/>
      <rect class="rm" x="262" y="3" width="20" height="18" rx="4"/>
      <text class="rmText" x="272" y="16">&#215;</text>
    </g>

    <!-- row 3: green outer -->
    <g transform="translate(18 154)">
      <rect class="swatch" x="0" y="2" width="20" height="20" rx="4" fill="#22c55e"/>
      <rect class="track" x="32" y="8" width="120" height="7" rx="3.5"/>
      <rect class="fill" x="32" y="8" width="60" height="7" rx="3.5"/>
      <circle class="knob" cx="92" cy="11" r="8"/>
      <text class="readout" x="32" y="34">0.019</text>
      <rect class="track" x="168" y="8" width="52" height="7" rx="3.5"/>
      <rect class="fill" x="168" y="8" width="16" height="7" rx="3.5"/>
      <circle class="knob" cx="184" cy="11" r="7"/>
      <rect class="box" x="234" y="3" width="18" height="18" rx="3"/>
      <path d="M237 12 l4 4 l7 -8" fill="none" stroke="#22b8ff" stroke-width="2.4"/>
      <rect class="rm" x="262" y="3" width="20" height="18" rx="4"/>
      <text class="rmText" x="272" y="16">&#215;</text>
    </g>

    <!-- pointers -->
    <circle class="badge" cx="16" cy="72" r="15"/><text class="badgeText" x="16" y="73">2</text>
    <circle class="badge" cx="128" cy="118" r="15"/><text class="badgeText" x="128" y="119">3</text>
    <circle class="badge" cx="204" cy="166" r="15"/><text class="badgeText" x="204" y="167">4</text>
  </g>

  <!-- legend -->
  <g transform="translate(566 356)">
    <rect class="legendCard" width="480" height="158" rx="16"/>
    <g transform="translate(22 30)">
      <circle class="badge" cx="13" cy="13" r="14"/><text class="badgeText" x="13" y="14">1</text>
      <text class="legendTitle" x="38" y="10">Add surface</text>
      <text class="legendText" x="38" y="30">Stack another isosurface (up to six).</text>
    </g>
    <g transform="translate(22 72)">
      <circle class="badge" cx="13" cy="13" r="14"/><text class="badgeText" x="13" y="14">2</text>
      <text class="legendText" x="38" y="6">Color each surface with its swatch.</text>
      <text class="legendText" x="38" y="26"><tspan font-weight="700" fill="#0f172a">3</tspan> Isovalue &#183; <tspan font-weight="700" fill="#0f172a">4</tspan> Opacity &#183; checkbox hides it &#183; &#215; removes it.</text>
    </g>
    <g transform="translate(22 122)">
      <text class="legendText" x="0" y="6">A negative isovalue shows the opposite orbital lobe (red here).</text>
    </g>
  </g>
</svg>
