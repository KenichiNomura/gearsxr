<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">See electron density and orbitals</title>
  <desc id="desc">Loading a Gaussian Cube file shows a 3D isosurface — a blue positive lobe and a red negative lobe — with an isovalue slider, opacity, and a show plus-or-minus lobes toggle.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1220" flood-opacity="0.16"/></filter>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08131f"/><stop offset="1" stop-color="#05070c"/></linearGradient>
    <radialGradient id="posLobe" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#7db0ff"/><stop offset="1" stop-color="#2f6fe0"/></radialGradient>
    <radialGradient id="negLobe" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#ff8f8f"/><stop offset="1" stop-color="#d63b3b"/></radialGradient>
    <style>
      .page { fill: #f5f7fb; }
      .screen { fill: url(#screen); stroke: #d6dde8; stroke-width: 2; filter: url(#shadow); }
      .mock { fill: #151b24; stroke: #d6dde8; stroke-width: 2; filter: url(#shadow); }
      .label { fill: #dce5f2; font: 700 15px system-ui, sans-serif; }
      .heading { fill: #f8fafc; font: 800 18px system-ui, sans-serif; }
      .muted { fill: #93a4b8; font: 13px system-ui, sans-serif; }
      .track { fill: #2a3444; }
      .fill { fill: #22b8ff; }
      .knob { fill: #22b8ff; stroke: #eaf7ff; stroke-width: 2; }
      .check { fill: #22b8ff; stroke: #eaf7ff; stroke-width: 1.5; }
      .badge { fill: #22b8ff; stroke: #ffffff; stroke-width: 3; }
      .badgeText { fill: white; font: 800 18px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
      .legendCard { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1.5; filter: url(#shadow); }
      .legendTitle { fill: #0f172a; font: 800 17px system-ui, sans-serif; }
      .legendText { fill: #536273; font: 13.5px system-ui, sans-serif; }
      .dotPos { fill: #3b82f6; }
      .dotNeg { fill: #ef4444; }
    </style>
  </defs>
  <rect class="page" width="1100" height="560"/>
  <text x="54" y="62" fill="#0f172a" style="font: 800 28px system-ui, sans-serif;">See electron density and orbitals</text>
  <text x="54" y="88" fill="#64748b" style="font: 16px system-ui, sans-serif;">Load a Gaussian Cube (.cube) file to show a 3D surface around the atoms.</text>

  <!-- scene with lobes -->
  <g transform="translate(54 120)">
    <rect class="screen" width="470" height="320" rx="20"/>
    <g transform="translate(235 160)">
      <!-- negative lobe behind, positive lobe front -->
      <ellipse cx="-70" cy="10" rx="86" ry="82" fill="url(#negLobe)" opacity="0.9"/>
      <ellipse cx="66" cy="-6" rx="96" ry="92" fill="url(#posLobe)" opacity="0.72"/>
      <!-- atom at the node -->
      <circle cx="-2" cy="2" r="24" fill="#9aa4b2" stroke="#c9d2dd" stroke-width="2"/>
    </g>
    <text class="muted" x="24" y="298">One carbon atom with a p-orbital: two lobes, opposite signs.</text>
  </g>

  <!-- mock isosurface panel -->
  <g transform="translate(566 120)">
    <rect class="mock" width="270" height="238" rx="14"/>
    <text class="heading" x="20" y="34">Isosurface</text>

    <text class="label" x="20" y="66">Isovalue: 0.144</text>
    <rect class="track" x="20" y="76" width="230" height="8" rx="4"/>
    <rect class="fill" x="20" y="76" width="96" height="8" rx="4"/>
    <circle class="knob" cx="116" cy="80" r="9"/>
    <circle class="badge" cx="256" cy="72" r="17"/><text class="badgeText" x="256" y="73">2</text>

    <text class="label" x="20" y="116">Opacity</text>
    <rect class="track" x="20" y="126" width="230" height="8" rx="4"/>
    <rect class="fill" x="20" y="126" width="150" height="8" rx="4"/>
    <circle class="knob" cx="170" cy="130" r="9"/>
    <circle class="badge" cx="256" cy="122" r="17"/><text class="badgeText" x="256" y="123">3</text>

    <rect class="check" x="20" y="164" width="16" height="16" rx="3"/>
    <path d="M23 172 l4 4 l7 -8" fill="none" stroke="#04202e" stroke-width="2.4"/>
    <text class="label" x="44" y="177">Show &#177; lobes</text>
    <rect class="check" x="150" y="164" width="16" height="16" rx="3"/>
    <path d="M153 172 l4 4 l7 -8" fill="none" stroke="#04202e" stroke-width="2.4"/>
    <text class="label" x="174" y="177">Visible</text>
    <circle class="badge" cx="20" cy="172" r="17"/><text class="badgeText" x="20" y="173">4</text>

    <circle class="dotPos" cx="26" cy="212" r="6"/>
    <text class="muted" x="38" y="216">positive</text>
    <circle class="dotNeg" cx="120" cy="212" r="6"/>
    <text class="muted" x="132" y="216">negative</text>
  </g>

  <!-- legend / steps -->
  <g transform="translate(566 384)">
    <rect class="legendCard" width="480" height="130" rx="16"/>
    <g transform="translate(24 34)">
      <circle class="badge" cx="14" cy="14" r="15"/><text class="badgeText" x="14" y="15">1</text>
      <text class="legendTitle" x="42" y="12">Load a .cube file</text>
      <text class="legendText" x="42" y="34">Drop it in, or paste its link and click Load URL.</text>
    </g>
    <g transform="translate(24 84)">
      <circle class="badge" cx="14" cy="14" r="15"/><text class="badgeText" x="14" y="15">2</text>
      <text class="legendText" x="42" y="4">Isovalue sets how much of the cloud you see.</text>
      <text class="legendText" x="42" y="26">Opacity (3) fades it; Show &#177; lobes (4) adds the red lobe.</text>
    </g>
  </g>

  <!-- badge 1 pointer onto the scene -->
  <circle class="badge" cx="78" cy="150" r="17"/><text class="badgeText" x="78" y="151">1</text>
</svg>
